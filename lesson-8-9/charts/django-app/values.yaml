  ALLOWED_HOSTS: "*"
  DB_ENGINE: django.db.backends.sqlite3
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USER: user
  DB_NAME: db.sqlite3

secret:
  DB_PASSWORD: ""  # Override: --set secret.DB_PASSWORD=yourpassword
