replicaCount: 1

image:
  repository: 000000000000.dkr.ecr.eu-north-1.amazonaws.com/krav-yurii-lesson-8-9-ecr
  pullPolicy: Always
  tag: 4

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70

